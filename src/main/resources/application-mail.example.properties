# Example Mail properties (do NOT commit real credentials). Use env vars instead.
# Mailtrap example
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=true

# Usage:
# 1. Create a Mailtrap inbox and copy the username/password.
# 2. Set environment variables before running the app (PowerShell):
#    $env:MAIL_USERNAME = 'your-mailtrap-username'
#    $env:MAIL_PASSWORD = 'your-mailtrap-password'
#    mvn spring-boot:run
# 3. Alternatively, set them permanently with `setx` and restart your shell.
