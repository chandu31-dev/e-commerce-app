<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catchy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">🛍️ Catchy</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Login</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Don't have an account? <a href="/signup">Sign up here</a>
            </p>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });

                const result = await response.json();
                
                if (result.success && result.token) {
                    // Store token in localStorage for JavaScript access
                    localStorage.setItem('JWT_TOKEN', result.token);
                    showMessage('Login successful! Redirecting...', 'success');
                    const redirectUrl = result.redirectUrl || '/buyer/home';
                    // Add delay to ensure cookie is set and sent
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 500);
                } else {
                    showMessage(result.message || 'Invalid email or password', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('Error logging in', 'error');
            }
        }
    </script>
</body>
</html>
