<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Addresses - Catchy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .address-card {
            border: 1px solid #ddd;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 4px;
            background: #f9f9f9;
        }
        .address-card h3 {
            margin-top: 0;
        }
        .address-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .address-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #fff;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .close-btn {
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .checkbox-group input {
            width: auto;
        }
        .modal-content button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .modal-content button[type="submit"] {
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        .modal-content button[type="submit"]:hover {
            background: #5568d3;
        }
        #use-location-modal {
            background: #28a745;
            color: white;
            font-weight: bold;
            width: auto;
            margin-bottom: 1rem;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #use-location-modal:hover {
            background: #218838;
        }
        #cancel-modal {
            background: #dc3545;
            color: white;
            font-weight: bold;
        }
        #cancel-modal:hover {
            background: #c82333;
        }
        .button-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .button-group button {
            flex: 1;
            width: auto !important;
        }
        #add-address-btn {
            background: #667eea;
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        #add-address-btn:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">🛍️ Catchy</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/cart">Cart</a></li>
                <li><a href="/orders">My Orders</a></li>
                <li><a href="/addresses">Addresses</a></li>
                <li><a href="/profile">Profile</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Manage Delivery Addresses</h2>
        <button class="btn btn-primary" id="add-address-btn">+ Add New Address</button>

        <div id="addresses-list" style="margin-top: 2rem;"></div>
    </div>

    <!-- Add/Edit Address Modal -->
    <div id="address-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Address</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="address-form">
                <div class="form-group">
                    <label for="address-label">Label (e.g., Home, Office)</label>
                    <input type="text" id="address-label" placeholder="Home">
                </div>
                <div class="form-group">
                    <label for="address-text">Address *</label>
                    <textarea id="address-text" placeholder="Street, City, State, Country" required></textarea>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label for="address-lat">Latitude</label>
                        <input type="text" id="address-lat" placeholder="e.g., 12.34">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="address-lng">Longitude</label>
                        <input type="text" id="address-lng" placeholder="e.g., 56.78">
                    </div>
                </div>
                <div class="form-group">
                    <label for="address-phone">Phone</label>
                    <input type="text" id="address-phone" placeholder="Phone number">
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="address-default">
                    <label for="address-default" style="margin: 0;">Set as default address</label>
                </div>
                <button type="button" class="btn" id="use-location-modal">Use My Location</button>
                <div class="button-group">
                    <button type="submit" class="btn btn-primary" id="save-address-btn">Save Address</button>
                    <button type="button" class="btn btn-danger" id="cancel-modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        let currentEditId = null;

        const modal = document.getElementById('address-modal');
        const addBtn = document.getElementById('add-address-btn');
        const closeBtn = document.getElementById('close-modal');
        const cancelBtn = document.getElementById('cancel-modal');
        const form = document.getElementById('address-form');
        const useLocBtn = document.getElementById('use-location-modal');
        const addressList = document.getElementById('addresses-list');

        addBtn.addEventListener('click', () => {
            currentEditId = null;
            document.getElementById('modal-title').textContent = 'Add New Address';
            form.reset();
            modal.style.display = 'block';
        });

        closeBtn.addEventListener('click', () => modal.style.display = 'none');
        cancelBtn.addEventListener('click', () => modal.style.display = 'none');

        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        useLocBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showMessage('Geolocation not available', 'error');
                return;
            }
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                document.getElementById('address-lat').value = lat;
                document.getElementById('address-lng').value = lng;
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);
                    const data = await res.json();
                    if (data && data.display_name) {
                        document.getElementById('address-text').value = data.display_name;
                    }
                } catch (e) { /* ignore */ }
            }, (err) => {
                showMessage('Unable to get location', 'error');
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const label = document.getElementById('address-label').value;
            const address = document.getElementById('address-text').value;
            const lat = parseFloat(document.getElementById('address-lat').value) || null;
            const lng = parseFloat(document.getElementById('address-lng').value) || null;
            const phone = document.getElementById('address-phone').value;
            const isDefault = document.getElementById('address-default').checked;

            if (!address) {
                showMessage('Please enter an address', 'error');
                return;
            }

            try {
                const token = getToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const payload = { label, address, latitude: lat, longitude: lng, phone, isDefault };
                const method = currentEditId ? 'PUT' : 'POST';
                const url = currentEditId ? `/api/addresses/${currentEditId}` : '/api/addresses';

                const res = await fetch(url, {
                    method,
                    headers,
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    showMessage(currentEditId ? 'Address updated' : 'Address added', 'success');
                    modal.style.display = 'none';
                    loadAddresses();
                } else {
                    showMessage('Error saving address', 'error');
                }
            } catch (e) {
                showMessage('Error saving address', 'error');
            }
        });

        async function loadAddresses() {
            try {
                const token = getToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch('/api/addresses', { headers });
                const addresses = await res.json();

                addressList.innerHTML = '';
                if (addresses.length === 0) {
                    addressList.innerHTML = '<p>No addresses saved yet. <a href="#" onclick="document.getElementById(\'add-address-btn\').click(); return false;">Add one</a></p>';
                    return;
                }

                addresses.forEach(addr => {
                    const card = document.createElement('div');
                    card.className = 'address-card';
                    card.innerHTML = `
                        <h3>${addr.label ? addr.label : 'Address'} ${addr.isDefault ? '<span style="color: green; font-size: 0.8em;">(Default)</span>' : ''}</h3>
                        <p><strong>Address:</strong> ${addr.address}</p>
                        ${addr.latitude ? `<p><strong>Coordinates:</strong> ${addr.latitude}, ${addr.longitude}</p>` : ''}
                        ${addr.phone ? `<p><strong>Phone:</strong> ${addr.phone}</p>` : ''}
                        <div class="address-actions">
                            <button class="btn" onclick="editAddress(${addr.id})">Edit</button>
                            <button class="btn btn-danger" onclick="deleteAddress(${addr.id})">Delete</button>
                        </div>
                    `;
                    addressList.appendChild(card);
                });
            } catch (e) {
                console.error('Error loading addresses', e);
            }
        }

        async function editAddress(id) {
            try {
                const token = getToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(`/api/addresses/${id}`, { headers });
                const addr = await res.json();

                currentEditId = id;
                document.getElementById('modal-title').textContent = 'Edit Address';
                document.getElementById('address-label').value = addr.label || '';
                document.getElementById('address-text').value = addr.address || '';
                document.getElementById('address-lat').value = addr.latitude || '';
                document.getElementById('address-lng').value = addr.longitude || '';
                document.getElementById('address-phone').value = addr.phone || '';
                document.getElementById('address-default').checked = addr.isDefault || false;
                modal.style.display = 'block';
            } catch (e) {
                showMessage('Error loading address', 'error');
            }
        }

        async function deleteAddress(id) {
            if (!confirm('Are you sure you want to delete this address?')) return;

            try {
                const token = getToken();
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const res = await fetch(`/api/addresses/${id}`, {
                    method: 'DELETE',
                    headers
                });

                if (res.ok) {
                    showMessage('Address deleted', 'success');
                    loadAddresses();
                } else {
                    showMessage('Error deleting address', 'error');
                }
            } catch (e) {
                showMessage('Error deleting address', 'error');
            }
        }

        // Load addresses on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadAddresses();
        });
    </script>
</body>
</html>
