<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration - Catchy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">🛍️ Catchy</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-container" style="max-width: 600px;">
            <h2>Become a Vendor</h2>
            <p style="color: #666; margin-bottom: 1.5rem;">Start selling your products on Catchy today!</p>

            <form id="vendor-register-form" onsubmit="handleVendorRegister(event)">
                <div class="form-group">
                    <label for="shopName">Shop Name *</label>
                    <input type="text" id="shopName" name="shopName" required minlength="3" maxlength="100">
                </div>

                <div class="form-group">
                    <label for="contactEmail">Contact Email *</label>
                    <input type="email" id="contactEmail" name="contactEmail" required>
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="text" id="phoneNumber" name="phoneNumber">
                </div>

                <div class="form-group">
                    <label for="address">Business Address</label>
                    <input type="text" id="address" name="address">
                </div>

                <div class="form-group">
                    <label for="description">Shop Description</label>
                    <textarea id="description" name="description" rows="4" style="width: 100%; padding: 0.75rem; border: 2px solid #ddd; border-radius: 5px; font-family: Arial, sans-serif;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Register as Vendor</button>
            </form>

            <!-- No approval required; vendor access is granted immediately -->

            <p style="text-align: center; margin-top: 1rem; color: #666;">
                Already a vendor? <a href="/vendor/dashboard">Go to dashboard</a>
            </p>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
    <script>
        async function handleVendorRegister(event) {
            event.preventDefault();
            const shopName = document.getElementById('shopName').value;
            const contactEmail = document.getElementById('contactEmail').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const address = document.getElementById('address').value;
            const description = document.getElementById('description').value;

            try {
                const formData = new FormData();
                formData.append('shopName', shopName);
                formData.append('contactEmail', contactEmail);
                formData.append('phoneNumber', phoneNumber);
                formData.append('address', address);
                formData.append('description', description);

                const response = await fetch('/vendor/api/register', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                const result = await response.json();

                if (result.success) {
                    // Update JWT token if new one provided
                    if (result.token) {
                        localStorage.setItem('JWT_TOKEN', result.token);
                    }

                    // Redirect to vendor dashboard on success
                    showMessage('Vendor registration successful! Redirecting to dashboard...', 'success');
                    setTimeout(() => { window.location.href = '/vendor/dashboard'; }, 800);
                } else {
                    showMessage(result.message || 'Error registering as vendor', 'error');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('Error registering as vendor', 'error');
            }
        }
    </script>
</body>
</html>
