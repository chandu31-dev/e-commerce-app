<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Catchy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        </nav>
                <li><a href="/login">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Sign Up</h2>
            <form id="signup-form" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required minlength="2">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <input type="hidden" id="role" name="role" th:value="${role}">
                <p style="text-align:center; margin-bottom:1rem;">Registering as: <strong th:text="${role}">USER</strong></p>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign Up</button>
            </form>
            <p style="text-align: center; margin-top: 1rem;">
                Already have an account? <a href="/login">Login here</a>
            </p>
        </div>
    </div>

            <script th:src="@{/js/main.js}"></script>
    <script>
        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value || 'USER';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password, role })
                });

                const result = await response.json();

                if (result && result.success) {
                    showMessage('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        // If server provided redirectUrl, go there; otherwise default to login
                        window.location.href = result.redirectUrl || '/login';
                    }, 1000);
                } else {
                    const msg = result && result.message ? result.message : 'Error creating account';
                    showMessage(msg, 'error');
                }
            } catch (error) {
                showMessage('Error creating account', 'error');
            }
        }
    </script>
</body>
</html>
