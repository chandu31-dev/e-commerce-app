<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Catchy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="/" class="logo">🛍️ Catchy</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/products">Products</a></li>
                <li><a href="/cart">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="/orders">My Orders</a></li>
                <li><a href="/profile">My Profile</a></li>
                <li><a href="/addresses">Manage Addresses</a></li>
                <li th:if="${!#authorization.expression('hasRole(''VENDOR'')')}">
                    <a href="/vendor/register">Become Vendor</a>
                </li>
                <li th:if="${#authorization.expression('hasRole(''VENDOR'')')}">
                    <a href="/vendor/dashboard">Vendor Dashboard</a>
                </li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Shopping Cart</h2>
        
        <div th:if="${cartItems.isEmpty()}" style="text-align: center; padding: 3rem;">
            <h3>Your cart is empty</h3>
            <p>Start shopping to add items to your cart!</p>
            <a href="/products" class="btn btn-primary" style="margin-top: 1rem;">Browse Products</a>
        </div>

        <div th:if="${!cartItems.isEmpty()}">
            <div th:each="cartItem : ${cartItems}" class="cart-item">
                <img th:src="${cartItem.product.imageURL != null ? cartItem.product.imageURL : 'https://via.placeholder.com/100'}" 
                     th:alt="${cartItem.product.name}" class="cart-item-image">
                <div class="cart-item-details">
                    <h3 th:text="${cartItem.product.name}"></h3>
                    <p th:text="${cartItem.product.category}"></p>
                    <p>Price: <span th:text="${currencySymbol}"></span><span th:text="${#numbers.formatDecimal(cartItem.product.price, 1, 2)}"></span></p>
                </div>
                <div style="margin-left: auto; text-align: right;">
                    <div class="quantity-selector">
                        <label>Qty:</label>
                        <input type="number" 
                               th:id="'qty-' + ${cartItem.id}"
                               th:value="${cartItem.quantity}" 
                               min="1" 
                               th:max="${cartItem.product.stock}"
                               th:onchange="'updateCartQuantity(' + ${cartItem.id} + ', parseInt(document.getElementById(\\'qty-' + ${cartItem.id} + '\\').value))'">
                    </div>
                    <div class="cart-item-price" style="margin-top: 0.5rem;">
                        <span th:text="${currencySymbol}"></span><span th:text="${#numbers.formatDecimal(cartItem.product.price * cartItem.quantity, 1, 2)}"></span>
                    </div>
                    <button class="btn btn-danger" 
                            style="margin-top: 0.5rem;"
                            th:onclick="'removeFromCart(' + ${cartItem.id} + ')'">Remove</button>
                </div>
            </div>

            <div class="cart-total">
                <h2>Total: <span th:text="${currencySymbol}"></span><span th:text="${#numbers.formatDecimal(total, 1, 2)}"></span></h2>
                <button class="btn btn-success" style="margin-top: 1rem;" onclick="placeOrder()">Place Order</button>
            </div>
        </div>
    </div>

    <!-- Address Selection Modal -->
    <div id="addressModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            <h3>Select Delivery Address</h3>
            <div id="addressList" style="max-height: 300px; overflow-y: auto; margin: 1rem 0; border: 1px solid #dee2e6; padding: 1rem; border-radius: 4px;">
                <!-- Addresses will be loaded here -->
            </div>
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                <div style="flex: 2; display:flex; gap:8px; align-items:center;">
                    <input id="couponInput" placeholder="Coupon code (optional)" style="flex:1; padding:8px; border:1px solid #ccc; border-radius:4px;">
                    <button class="btn btn-primary" style="flex: 0 0 auto;" onclick="confirmOrderWithAddress()">Continue</button>
                </div>
                <button class="btn btn-secondary" style="flex: 1;" onclick="closeAddressModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
