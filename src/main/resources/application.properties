spring.application.name=catchy

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/catchy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=3110
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationThatMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# Server Configuration
server.port=8080

# Vendor Payout Provider (options: mock)
vendor.payout.provider=mock


# Feature flags
# When `features.addresses-only` is `true` payment and email related beans are disabled
# Set to `false` (or remove) to enable payment/email functionality again
features.addresses-only=false

# Mail Configuration (Optional - set via environment variables)
# Development: when SMTP not configured, emails are logged and written to target/*.txt
# Production/Testing: configure via env vars shown in setup-mail-env scripts below
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=learn31102002@gmail.com
spring.mail.password=yqrc turr aivw luay
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optional admin email (used for vendor registration notifications).
mail.admin=chandukiranpotru0@gmail.com

# Logging Configuration
logging.level.root=INFO
logging.level.com.catchy=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE